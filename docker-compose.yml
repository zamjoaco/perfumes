services:
  db:
    image: postgres:16-alpine
    container_name: perfumes-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: perfumes
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Definí DB_PASSWORD en .env (ver .env.example)}
      TZ: America/Argentina/Buenos_Aires
    ports:
      - "5432:5432"
    volumes:
      - perfumes_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d perfumes"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: perfumes-app
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/perfumes
      DB_PASSWORD: ${DB_PASSWORD}
      APP_ADMIN_USER: ${APP_ADMIN_USER}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD}
      APP_ADMIN_RESET_PASSWORD: ${APP_ADMIN_RESET_PASSWORD:-false}
      APP_JWT_SECRET: ${APP_JWT_SECRET}
      TZ: America/Argentina/Buenos_Aires
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  perfumes_data:
